<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de pesos</title>
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="js/interfaz.js"></script>
</head>
<body>
  <main>
    <h1>Calculadora de pesos</h1>
    <p class="intro">Elegí la forma de la pieza, cargá sus medidas en milímetros y elegí el material.</p>

    <form id="calculadora" novalidate>
      <div class="campo">
        <label for="forma">Forma</label>
        <select id="forma" name="forma"></select>
      </div>

      <fieldset>
        <legend>Medidas</legend>
        <div id="esquema"></div>
        <div id="medidas"></div>
      </fieldset>

      <div class="campo">
        <label for="material">Material</label>
        <select id="material" name="material"></select>
        <p class="densidad"><span id="densidad"></span> <a id="fuente" rel="noopener noreferrer" target="_blank">(fuente)</a></p>
      </div>

      <button type="submit">Calcular</button>
    </form>

    <output id="resultado" for="calculadora" aria-live="polite"></output>
  </main>
</body>
</html>
